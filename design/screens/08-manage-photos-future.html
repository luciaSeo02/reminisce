<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ajustes de fotos: arrastrar y describir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:opsz,wght,SOFT@9..144,500..700,100&display=swap" rel="stylesheet">
<style>

body{margin:0}
button{font-family:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:5px solid #1F6A85;outline-offset:4px}
textarea::placeholder{color:#6B5A4B;opacity:1}
.serif{font-family:Fraunces,Georgia,serif;font-variation-settings:'SOFT' 100;font-weight:600}

</style>
</head>
<body>


<div style="position:relative;overflow:hidden;width:1180px;height:1040px;background:#FBF4E8;color:#33241A;font-family:'Atkinson Hyperlegible',system-ui,sans-serif">

  <svg style="position:absolute;right:-170px;top:-210px" width="620" height="620" viewBox="0 0 200 200" aria-hidden="true"><path fill="#F7DEC9" opacity="0.75" transform="translate(100 100)" d="M44.7,-58.6C57.6,-48.4,67.6,-34.1,72.2,-18.1C76.8,-2.1,75.9,15.6,68.1,29.4C60.3,43.2,45.6,53.2,30.1,60.4C14.6,67.6,-1.7,72,-17.6,69.2C-33.5,66.4,-49,56.4,-59.3,42.8C-69.6,29.2,-74.7,12,-72.6,-4C-70.5,-20,-61.2,-34.8,-49.1,-45.1C-37,-55.4,-22.1,-61.2,-5.6,-59.1C10.9,-57,31.8,-68.8,44.7,-58.6Z"/></svg>

  <div style="position:relative;box-sizing:border-box;height:100%;display:flex;flex-direction:column;gap:20px;padding:32px 56px 44px">

    <div style="display:flex;align-items:center;justify-content:space-between">
      <button style="height:60px;padding:0 28px;border-radius:30px;border:3px solid #B4532A;background:#FFFCF6;color:#7A3515;font-size:25px;font-weight:700;display:flex;align-items:center;gap:12px;box-shadow:0 10px 22px -10px rgba(122,53,21,0.45)">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#B4532A" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
        Volver a ajustes
      </button>
      <div style="display:flex;align-items:center;gap:14px">
        <span class="serif" style="font-size:40px;color:#7A3515">Fotos</span>
        <div style="width:52px;height:52px;border-radius:26px;background:#B4532A;display:flex;align-items:center;justify-content:center">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#FFFCF6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="9" cy="10" r="1.8"/><path d="M3 17l6-5 4 4 3-3 5 5"/></svg>
        </div>
      </div>
    </div>

    <div style="display:flex;align-items:center;justify-content:space-between;gap:24px;box-sizing:border-box;padding:22px 30px;border-radius:28px;background:#FFFCF6;border:2px solid #EADCC8;box-shadow:0 16px 30px -22px rgba(122,53,21,0.4)">
      <div>
        <div class="serif" style="font-size:32px;color:#3A2418;line-height:1.15">Añadir fotos</div>
        <div style="margin-top:4px;font-size:25px;color:#5C4B3D">Elige fotos de esta tablet.</div>
      </div>
      <button style="height:72px;padding:0 34px;border-radius:36px;border:none;background:#B4532A;color:#FFFCF6;font-size:27px;font-weight:700;display:flex;align-items:center;gap:12px;box-shadow:0 14px 26px -12px rgba(122,53,21,0.7)">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FFFCF6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        Añadir fotos
      </button>
    </div>

    <div style="flex:1;box-sizing:border-box;padding:26px 30px;border-radius:28px;background:#FFFCF6;border:2px solid #EADCC8;box-shadow:0 16px 30px -22px rgba(122,53,21,0.4);display:flex;flex-direction:column">
      <div style="display:flex;align-items:baseline;justify-content:space-between">
        <div class="serif" style="font-size:32px;color:#3A2418;line-height:1.15">Tus fotos</div>
        <div style="font-size:24px;color:#5C4B3D">12 fotos</div>
      </div>
      <div style="margin-top:8px;font-size:24px;color:#5C4B3D">Mantén pulsado el asa y arrastra para cambiar el orden. Escribe quién sale y dónde fue.</div>

      <div style="margin-top:18px;display:flex;flex-direction:column;gap:14px">

        <div style="display:flex;align-items:center;gap:16px;padding:14px 18px 14px 10px;border-radius:24px;background:#FBF4E8;border:2px solid #EADCC8">
          <button aria-label="Arrastrar para cambiar el orden" style="width:64px;height:84px;border-radius:18px;border:none;background:transparent;display:flex;align-items:center;justify-content:center;flex:none"><svg width="30" height="38" viewBox="0 0 20 28" fill="#7A6451" aria-hidden="true"><circle cx="6" cy="5" r="2.4"/><circle cx="14" cy="5" r="2.4"/><circle cx="6" cy="14" r="2.4"/><circle cx="14" cy="14" r="2.4"/><circle cx="6" cy="23" r="2.4"/><circle cx="14" cy="23" r="2.4"/></svg></button>
          <div style="width:168px;height:112px;border-radius:16px;overflow:hidden;flex:none;background:#CFE3EC">
            <svg width="168" height="112" viewBox="0 0 168 112" aria-hidden="true"><rect width="168" height="112" fill="#CFE3EC"/><circle cx="130" cy="28" r="14" fill="#F4C45A"/><rect y="58" width="168" height="30" fill="#7FB2C8"/><path d="M0 84 Q50 66 100 80 T168 74 V112 H0Z" fill="#F1D9AE"/><path d="M62 56h30l-5 8H67z" fill="#B4532A"/><path d="M77 30v26l-14-2z" fill="#FFFCF6"/></svg>
          </div>
          <div style="flex:1;min-width:0">
            <label for="cap-1" style="display:block;font-size:22px;font-weight:700;color:#3A2418;margin-bottom:6px">Quién sale y dónde fue</label>
            <textarea id="cap-1" rows="2" style="width:100%;height:80px;box-sizing:border-box;resize:none;padding:12px 18px;border-radius:20px;border:3px solid #B9A184;background:#FFFFFF;font-family:inherit;font-size:25px;line-height:1.3;color:#2B2118">Un día de verano en la playa, con toda la familia</textarea>
          </div>
          <button style="height:64px;padding:0 24px;border-radius:32px;border:3px solid #D9C4A8;background:#FFFCF6;color:#7A3515;font-size:24px;font-weight:700">Quitar</button>
        </div>

        <div style="display:flex;align-items:center;gap:16px;padding:14px 18px 14px 10px;border-radius:24px;background:#FBF4E8;border:2px solid #EADCC8">
          <button aria-label="Arrastrar para cambiar el orden" style="width:64px;height:84px;border-radius:18px;border:none;background:transparent;display:flex;align-items:center;justify-content:center;flex:none"><svg width="30" height="38" viewBox="0 0 20 28" fill="#7A6451" aria-hidden="true"><circle cx="6" cy="5" r="2.4"/><circle cx="14" cy="5" r="2.4"/><circle cx="6" cy="14" r="2.4"/><circle cx="14" cy="14" r="2.4"/><circle cx="6" cy="23" r="2.4"/><circle cx="14" cy="23" r="2.4"/></svg></button>
          <div style="width:168px;height:112px;border-radius:16px;overflow:hidden;flex:none;background:#F6C9A8">
            <svg width="168" height="112" viewBox="0 0 168 112" aria-hidden="true"><rect width="168" height="112" fill="#F6C9A8"/><circle cx="48" cy="40" r="14" fill="#FFFCF6"/><path d="M0 88 Q40 52 84 70 T168 60 V112 H0Z" fill="#B4532A" opacity="0.75"/><path d="M0 104 Q60 80 120 98 T168 92 V112 H0Z" fill="#7FA987"/></svg>
          </div>
          <div style="flex:1;min-width:0">
            <label for="cap-2" style="display:block;font-size:22px;font-weight:700;color:#3A2418;margin-bottom:6px">Quién sale y dónde fue</label>
            <textarea id="cap-2" rows="2" placeholder="Por ejemplo: la boda de Carmen y Luis, en el pueblo" style="width:100%;height:80px;box-sizing:border-box;resize:none;padding:12px 18px;border-radius:20px;border:3px solid #B9A184;background:#FFFFFF;font-family:inherit;font-size:25px;line-height:1.3;color:#2B2118"></textarea>
          </div>
          <button style="height:64px;padding:0 24px;border-radius:32px;border:3px solid #D9C4A8;background:#FFFCF6;color:#7A3515;font-size:24px;font-weight:700">Quitar</button>
        </div>

        <div style="display:flex;align-items:center;gap:16px;padding:14px 18px 14px 10px;border-radius:24px;background:#FFFFFF;border:3px solid #1F6A85;box-shadow:0 26px 40px -14px rgba(18,56,74,0.55);margin:0 -8px;transform:rotate(-0.6deg)">
          <button aria-label="Arrastrar para cambiar el orden" style="width:64px;height:84px;border-radius:18px;border:none;background:#E8F1F5;display:flex;align-items:center;justify-content:center;flex:none"><svg width="30" height="38" viewBox="0 0 20 28" fill="#1F6A85" aria-hidden="true"><circle cx="6" cy="5" r="2.4"/><circle cx="14" cy="5" r="2.4"/><circle cx="6" cy="14" r="2.4"/><circle cx="14" cy="14" r="2.4"/><circle cx="6" cy="23" r="2.4"/><circle cx="14" cy="23" r="2.4"/></svg></button>
          <div style="width:168px;height:112px;border-radius:16px;overflow:hidden;flex:none;background:#DDEBD4">
            <svg width="168" height="112" viewBox="0 0 168 112" aria-hidden="true"><rect width="168" height="112" fill="#DDEBD4"/><rect x="58" y="44" width="52" height="40" fill="#FFFCF6"/><path d="M52 46l32-26 32 26z" fill="#B4532A"/><rect x="77" y="62" width="14" height="22" fill="#8A6410"/><circle cx="24" cy="88" r="7" fill="#F4C45A"/><circle cx="142" cy="92" r="7" fill="#E58A5B"/><rect y="86" width="168" height="26" fill="#7FA987" opacity="0.7"/></svg>
          </div>
          <div style="flex:1;min-width:0">
            <label for="cap-3" style="display:block;font-size:22px;font-weight:700;color:#3A2418;margin-bottom:6px">Quién sale y dónde fue</label>
            <textarea id="cap-3" rows="2" style="width:100%;height:80px;box-sizing:border-box;resize:none;padding:12px 18px;border-radius:20px;border:3px solid #B9A184;background:#FFFFFF;font-family:inherit;font-size:25px;line-height:1.3;color:#2B2118">La casa del pueblo, en el jardín con las flores</textarea>
          </div>
          <button style="height:64px;padding:0 24px;border-radius:32px;border:3px solid #D9C4A8;background:#FFFCF6;color:#7A3515;font-size:24px;font-weight:700">Quitar</button>
        </div>

      </div>

      <div style="flex:1"></div>
      <div style="margin-top:16px;font-size:24px;color:#5C4B3D">La descripción aparece debajo de la foto en el pase de fotos.</div>
    </div>

  </div>
</div>

</body>
</html>
