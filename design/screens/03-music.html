<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Música</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:opsz,wght,SOFT@9..144,500..700,100&display=swap" rel="stylesheet">
<style>

body{margin:0}
button{font-family:inherit;cursor:pointer}
button:focus-visible{outline:5px solid #B4532A;outline-offset:4px}
.serif{font-family:Fraunces,Georgia,serif;font-variation-settings:'SOFT' 100;font-weight:600}

</style>
</head>
<body>


<div style="position:relative;overflow:hidden;width:1180px;height:820px;background:#F6F3EA;color:#33241A;font-family:'Atkinson Hyperlegible',system-ui,sans-serif">

  <svg style="position:absolute;right:-170px;top:-210px" width="620" height="620" viewBox="0 0 200 200" aria-hidden="true"><path fill="#D6E7EF" opacity="0.8" transform="translate(100 100)" d="M44.7,-58.6C57.6,-48.4,67.6,-34.1,72.2,-18.1C76.8,-2.1,75.9,15.6,68.1,29.4C60.3,43.2,45.6,53.2,30.1,60.4C14.6,67.6,-1.7,72,-17.6,69.2C-33.5,66.4,-49,56.4,-59.3,42.8C-69.6,29.2,-74.7,12,-72.6,-4C-70.5,-20,-61.2,-34.8,-49.1,-45.1C-37,-55.4,-22.1,-61.2,-5.6,-59.1C10.9,-57,31.8,-68.8,44.7,-58.6Z"/></svg>
  <svg style="position:absolute;left:-200px;bottom:-260px" width="620" height="620" viewBox="0 0 200 200" aria-hidden="true"><path fill="#F7DEC9" opacity="0.6" transform="translate(100 100)" d="M44.7,-58.6C57.6,-48.4,67.6,-34.1,72.2,-18.1C76.8,-2.1,75.9,15.6,68.1,29.4C60.3,43.2,45.6,53.2,30.1,60.4C14.6,67.6,-1.7,72,-17.6,69.2C-33.5,66.4,-49,56.4,-59.3,42.8C-69.6,29.2,-74.7,12,-72.6,-4C-70.5,-20,-61.2,-34.8,-49.1,-45.1C-37,-55.4,-22.1,-61.2,-5.6,-59.1C10.9,-57,31.8,-68.8,44.7,-58.6Z"/></svg>

  <div style="position:relative;box-sizing:border-box;height:100%;display:flex;flex-direction:column;padding:32px 56px 44px">

    <div style="display:flex;align-items:center;justify-content:space-between">
      <button style="height:60px;padding:0 28px;border-radius:30px;border:3px solid #1F6A85;background:#FFFCF6;color:#12384A;font-size:25px;font-weight:700;display:flex;align-items:center;gap:12px;box-shadow:0 10px 22px -10px rgba(18,56,74,0.5)">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#1F6A85" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>
        Inicio
      </button>
      <div style="display:flex;align-items:center;gap:14px">
        <span class="serif" style="font-size:40px;color:#12384A">Música</span>
        <div style="width:52px;height:52px;border-radius:26px;background:#1F6A85;display:flex;align-items:center;justify-content:center">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#FFFCF6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V6l11-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg>
        </div>
      </div>
    </div>

    <div style="margin-top:26px;flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:30px">

      <div style="display:flex;flex-direction:column;gap:22px;min-height:0">
        <div style="position:relative;height:340px;border-radius:32px;background:#1B2B33;box-shadow:0 26px 44px -22px rgba(18,56,74,0.7);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;overflow:hidden">
          <svg width="190" height="190" viewBox="0 0 200 200" aria-hidden="true">
            <circle cx="100" cy="100" r="96" fill="#2B2118" stroke="#3A4B54" stroke-width="3"/>
            <circle cx="100" cy="100" r="78" fill="none" stroke="#4A3A2E" stroke-width="2"/>
            <circle cx="100" cy="100" r="62" fill="none" stroke="#4A3A2E" stroke-width="2"/>
            <circle cx="100" cy="100" r="46" fill="none" stroke="#4A3A2E" stroke-width="2"/>
            <circle cx="100" cy="100" r="30" fill="#1F6A85"/>
            <circle cx="100" cy="100" r="5" fill="#CFE3EC"/>
          </svg>
          <button style="position:absolute;right:18px;bottom:18px;height:58px;padding:0 24px;border-radius:29px;border:none;background:#FFFCF6;color:#12384A;font-size:23px;font-weight:700;display:flex;align-items:center;gap:10px;box-shadow:0 10px 20px -8px rgba(0,0,0,0.5)">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1F6A85" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
            Pantalla completa
          </button>
        </div>
        <div style="flex:1;border-radius:28px;background:#FFFCF6;border:2px solid #D2E2EA;padding:18px 28px;display:flex;align-items:center;gap:20px;box-shadow:0 16px 30px -18px rgba(18,56,74,0.4)">
          <div style="width:68px;height:68px;border-radius:34px;background:#DCEAF0;display:flex;align-items:center;justify-content:center;flex:none">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#1F6A85" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5l9 7-9 7zM18 5v14"/></svg>
          </div>
          <div style="display:flex;flex-direction:column;gap:2px">
            <span style="font-size:23px;color:#3F5560;font-weight:700">Después suena</span>
            <span class="serif" style="font-size:34px;font-weight:500;line-height:1.2;color:#12384A">Otra canción de la lista</span>
          </div>
        </div>
      </div>

      <div style="box-sizing:border-box;border-radius:36px;background:#FFFCF6;border:2px solid #D2E2EA;box-shadow:0 26px 44px -22px rgba(18,56,74,0.5);padding:34px 36px;display:flex;flex-direction:column;min-height:0">
        <div style="display:flex;align-items:center;gap:14px">
          <svg width="40" height="34" viewBox="0 0 40 34" aria-hidden="true"><rect x="2" y="14" width="6" height="20" rx="3" fill="#1F6A85"/><rect x="12" y="4" width="6" height="30" rx="3" fill="#1F6A85"/><rect x="22" y="10" width="6" height="24" rx="3" fill="#1F6A85"/><rect x="32" y="18" width="6" height="16" rx="3" fill="#1F6A85"/></svg>
          <span style="font-size:26px;font-weight:700;color:#1A4558">Suena ahora</span>
        </div>
        <div class="serif" style="margin-top:14px;font-size:54px;line-height:1.1;color:#12384A">Título de la canción</div>
        <div style="margin-top:10px;font-size:30px;line-height:1.3;color:#3F5560">Nombre del artista</div>
        <div style="flex:1"></div>
        <button style="height:100px;border-radius:50px;border:none;background:#1F6A85;color:#FFFCF6;font-size:36px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:18px;box-shadow:0 18px 32px -14px rgba(18,56,74,0.8)">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#FFFCF6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg>
          Pausar
        </button>
        <div style="margin-top:18px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px">
          <button style="height:80px;border-radius:40px;border:3px solid #1F6A85;background:#FFFCF6;color:#12384A;font-size:28px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:12px;box-shadow:0 12px 24px -14px rgba(18,56,74,0.5)">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#1F6A85" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
            Anterior
          </button>
          <button style="height:80px;border-radius:40px;border:3px solid #1F6A85;background:#FFFCF6;color:#12384A;font-size:28px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:12px;box-shadow:0 12px 24px -14px rgba(18,56,74,0.5)">
            Siguiente
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#1F6A85" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </button>
        </div>
      </div>

    </div>
  </div>
</div>

</body>
</html>
