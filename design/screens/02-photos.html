<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Fotos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:opsz,wght,SOFT@9..144,500..700,100&display=swap" rel="stylesheet">
<style>

body{margin:0}
button{font-family:inherit;cursor:pointer}
button:focus-visible{outline:5px solid #1F6A85;outline-offset:4px}
.serif{font-family:Fraunces,Georgia,serif;font-variation-settings:'SOFT' 100;font-weight:600}

</style>
</head>
<body>


<div style="position:relative;overflow:hidden;width:1180px;height:820px;background:#FBF4E8;color:#33241A;font-family:'Atkinson Hyperlegible',system-ui,sans-serif">

  <svg style="position:absolute;right:-170px;top:-210px" width="620" height="620" viewBox="0 0 200 200" aria-hidden="true"><path fill="#F7DEC9" opacity="0.75" transform="translate(100 100)" d="M44.7,-58.6C57.6,-48.4,67.6,-34.1,72.2,-18.1C76.8,-2.1,75.9,15.6,68.1,29.4C60.3,43.2,45.6,53.2,30.1,60.4C14.6,67.6,-1.7,72,-17.6,69.2C-33.5,66.4,-49,56.4,-59.3,42.8C-69.6,29.2,-74.7,12,-72.6,-4C-70.5,-20,-61.2,-34.8,-49.1,-45.1C-37,-55.4,-22.1,-61.2,-5.6,-59.1C10.9,-57,31.8,-68.8,44.7,-58.6Z"/></svg>

  <div style="position:relative;box-sizing:border-box;height:100%;display:flex;flex-direction:column;padding:32px 56px 36px">

    <div style="display:flex;align-items:center;justify-content:space-between">
      <button style="height:60px;padding:0 28px;border-radius:30px;border:3px solid #B4532A;background:#FFFCF6;color:#7A3515;font-size:25px;font-weight:700;display:flex;align-items:center;gap:12px;box-shadow:0 10px 22px -10px rgba(122,53,21,0.45)">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#B4532A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>
        Inicio
      </button>
      <div style="display:flex;align-items:center;gap:14px">
        <span class="serif" style="font-size:40px;color:#7A3515">Fotos</span>
        <div style="width:52px;height:52px;border-radius:26px;background:#B4532A;display:flex;align-items:center;justify-content:center">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#FFFCF6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="9" cy="10" r="1.8"/><path d="M3 17l6-5 4 4 3-3 5 5"/></svg>
        </div>
      </div>
    </div>

    <div style="margin-top:20px;flex:1;min-height:0;box-sizing:border-box;padding:16px;border-radius:32px;background:#FFFCF6;border:2px solid #EADCC8;box-shadow:0 26px 44px -22px rgba(122,53,21,0.45)">
      <div style="width:100%;height:100%;border-radius:20px;overflow:hidden;background:#CFE3EC">
        <svg width="100%" height="100%" viewBox="0 0 1000 420" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
          <rect width="1000" height="420" fill="#CFE3EC"/>
          <circle cx="770" cy="120" r="92" fill="#F8DDA0" opacity="0.6"/>
          <circle cx="770" cy="120" r="54" fill="#F4C45A"/>
          <ellipse cx="220" cy="90" rx="90" ry="26" fill="#FFFCF6" opacity="0.85"/>
          <ellipse cx="290" cy="74" rx="60" ry="22" fill="#FFFCF6" opacity="0.85"/>
          <ellipse cx="560" cy="150" rx="70" ry="18" fill="#FFFCF6" opacity="0.7"/>
          <path d="M0 250 Q140 190 300 230 T620 220 T1000 210 V280 H0Z" fill="#9DBFA6"/>
          <rect y="262" width="1000" height="110" fill="#7FB2C8"/>
          <path d="M60 300h90M240 330h120M520 300h100M700 335h140M880 305h80" stroke="#CFE3EC" stroke-width="5" stroke-linecap="round"/>
          <path d="M360 262h110l-18 26H378z" fill="#B4532A"/>
          <path d="M414 170v88l-52-6z" fill="#FFFCF6"/>
          <path d="M422 186v72l36-5z" fill="#F6E1CC"/>
          <path d="M0 370 Q250 310 520 350 T1000 330 V420 H0Z" fill="#F1D9AE"/>
        </svg>
      </div>
    </div>

    <div class="serif" style="margin-top:16px;text-align:center;font-size:44px;font-weight:500;line-height:1.2;color:#3A2418">Un día de verano en la playa</div>

    <div style="margin-top:12px;display:flex;align-items:center;justify-content:center;gap:10px" aria-hidden="true">
      <span style="width:14px;height:14px;border-radius:7px;background:#E3C7AE"></span><span style="width:14px;height:14px;border-radius:7px;background:#E3C7AE"></span>
      <span style="width:44px;height:14px;border-radius:7px;background:#B4532A"></span>
      <span style="width:14px;height:14px;border-radius:7px;background:#E3C7AE"></span><span style="width:14px;height:14px;border-radius:7px;background:#E3C7AE"></span><span style="width:14px;height:14px;border-radius:7px;background:#E3C7AE"></span><span style="width:14px;height:14px;border-radius:7px;background:#E3C7AE"></span>
    </div>

    <div style="margin-top:16px;display:flex;align-items:center;justify-content:center;gap:26px">
      <button style="height:76px;padding:0 34px;border-radius:38px;border:3px solid #B4532A;background:#FFFCF6;color:#7A3515;font-size:28px;font-weight:700;display:flex;align-items:center;gap:14px;box-shadow:0 12px 24px -12px rgba(122,53,21,0.45)">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#B4532A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
        Anterior
      </button>
      <button style="height:88px;padding:0 50px;border-radius:44px;border:none;background:#B4532A;color:#FFFCF6;font-size:32px;font-weight:700;display:flex;align-items:center;gap:16px;box-shadow:0 16px 30px -12px rgba(122,53,21,0.7)">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#FFFCF6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg>
        Pausar
      </button>
      <button style="height:76px;padding:0 34px;border-radius:38px;border:3px solid #B4532A;background:#FFFCF6;color:#7A3515;font-size:28px;font-weight:700;display:flex;align-items:center;gap:14px;box-shadow:0 12px 24px -12px rgba(122,53,21,0.45)">
        Siguiente
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#B4532A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </div>
  </div>
</div>

</body>
</html>
