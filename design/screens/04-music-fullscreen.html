<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Música a pantalla completa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:opsz,wght,SOFT@9..144,500..700,100&display=swap" rel="stylesheet">
<style>

body{margin:0}
button{font-family:inherit;cursor:pointer}
button:focus-visible{outline:5px solid #FFFCF6;outline-offset:4px}
.serif{font-family:Fraunces,Georgia,serif;font-variation-settings:'SOFT' 100;font-weight:600}

</style>
</head>
<body>


<div style="position:relative;overflow:hidden;width:1180px;height:820px;background:#0B1114;color:#FFFCF6;font-family:'Atkinson Hyperlegible',system-ui,sans-serif">

  <div style="position:absolute;left:0;top:40px;width:1180px;height:664px;background:#1B2B33;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px">
    <svg width="240" height="240" viewBox="0 0 200 200" aria-hidden="true">
      <circle cx="100" cy="100" r="96" fill="#2B2118" stroke="#3A4B54" stroke-width="3"/>
      <circle cx="100" cy="100" r="78" fill="none" stroke="#4A3A2E" stroke-width="2"/>
      <circle cx="100" cy="100" r="62" fill="none" stroke="#4A3A2E" stroke-width="2"/>
      <circle cx="100" cy="100" r="46" fill="none" stroke="#4A3A2E" stroke-width="2"/>
      <circle cx="100" cy="100" r="30" fill="#1F6A85"/>
      <circle cx="100" cy="100" r="5" fill="#CFE3EC"/>
    </svg>
    <span style="font-size:28px;color:#CFE3EC">Aquí se verá el vídeo, en grande</span>
  </div>

  <div style="position:absolute;left:0;right:0;bottom:0;height:116px;box-sizing:border-box;padding:0 40px;background:#0E171C;display:flex;align-items:center;justify-content:space-between;gap:24px">
    <div style="min-width:0">
      <div class="serif" style="font-size:36px;font-weight:600;line-height:1.15;color:#FFFCF6">Título de la canción</div>
      <div style="font-size:24px;line-height:1.3;color:#CFE3EC">Nombre del artista</div>
    </div>
    <div style="display:flex;align-items:center;gap:16px;flex:none">
      <button style="height:72px;padding:0 32px;border-radius:36px;border:none;background:#2A86A8;color:#06202B;font-size:26px;font-weight:700;display:flex;align-items:center;gap:12px">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#06202B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg>
        Pausar
      </button>
      <button style="height:72px;padding:0 28px;border-radius:36px;border:3px solid #CFE3EC;background:transparent;color:#FFFCF6;font-size:26px;font-weight:700;display:flex;align-items:center;gap:12px">
        Siguiente
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FFFCF6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
      <button style="height:72px;padding:0 28px;border-radius:36px;border:3px solid #CFE3EC;background:transparent;color:#FFFCF6;font-size:26px;font-weight:700;display:flex;align-items:center;gap:12px">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FFFCF6" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
        Salir
      </button>
    </div>
  </div>
</div>

</body>
</html>
